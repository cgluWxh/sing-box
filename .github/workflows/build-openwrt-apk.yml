---
# yamllint disable rule:line-length
name: Build OpenWrt APK (aarch64_cortex-a53)

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openwrt-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32  # v5
        with:
          go-version: 1.26.10
          cache: true
      - name: Patch OpenConnect idle-timeout recovery
        run: python3 .github/scripts/patch-openconnect-idle-timeout.py
      - name: Test OpenConnect
        run: go test -v -ldflags "$(cat release/LDFLAGS)" ./protocol/openconnect
      - name: Build Linux arm64 core
        env:
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
        run: |
          set -euo pipefail
          mkdir -p package-root/usr/bin dist
          REV=$(git rev-parse --short HEAD)
          VERSION="0.0.0_git$(git show -s --format=%ct HEAD)-r0"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          go build -trimpath -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "$(cat release/LDFLAGS) -s -w -X github.com/sagernet/sing-box/constant.Version=custom-openconnect-$REV" \
            -o package-root/usr/bin/sing-box ./cmd/sing-box
          file package-root/usr/bin/sing-box | tee dist/binary-info.txt
          grep -q 'ARM aarch64' dist/binary-info.txt
      - name: Stage OpenWrt service and configuration
        run: |
          set -euo pipefail
          install -Dm755 release/config/openwrt.init package-root/etc/init.d/sing-box
          install -Dm644 release/config/openwrt.conf package-root/etc/config/sing-box
          install -Dm644 release/config/config.json package-root/etc/sing-box/config.json
          install -Dm644 release/config/openwrt.keep package-root/lib/upgrade/keep.d/sing-box
          install -Dm644 LICENSE package-root/usr/share/licenses/sing-box/LICENSE
          mkdir -p package-root/usr/share/sing-box package-root/lib/apk/packages
          printf '%s\n' /etc/config/sing-box /etc/sing-box/config.json \
            > package-root/lib/apk/packages/sing-box.conffiles
          while read -r path; do
            printf '%s %s\n' "$path" "$(sha256sum "package-root$path" | cut -d ' ' -f1)"
          done < package-root/lib/apk/packages/sing-box.conffiles \
            > package-root/lib/apk/packages/sing-box.conffiles_static
      - name: Package unsigned OpenWrt APKv3
        run: |
          set -euo pipefail
          docker run --rm \
            -e APK_VERSION \
            -v "$PWD/package-root:/package-root" \
            -v "$PWD/dist:/dist" \
            alpine:edge sh -ec '
              apk --version
              chown -R 0:0 /package-root
              apk mkpkg \
                --info "name:sing-box" \
                --info "version:$APK_VERSION" \
                --info "arch:aarch64_cortex-a53" \
                --info "description:sing-box core with OpenConnect idle-timeout recovery" \
                --info "license:GPL-3.0-or-later" \
                --info "url:https://sing-box.sagernet.org/" \
                --info "depends:ca-bundle kmod-inet-diag kmod-tun firewall4 kmod-nft-queue" \
                --files /package-root \
                --output /dist/sing-box_openwrt_aarch64_cortex-a53.apk
              apk verify --allow-untrusted /dist/sing-box_openwrt_aarch64_cortex-a53.apk
            '
          cat > dist/INSTALL.txt <<'EOF'
          OpenWrt APKv3, aarch64_cortex-a53 only. Unsigned custom build.
          Contains sing-box core + procd service; no Desktop daemon or LuCI UI.
          Back up existing configuration and stop any existing sing-box service first.

          apk add --allow-untrusted ./sing-box_openwrt_aarch64_cortex-a53.apk

          Edit /etc/sing-box/config.json before starting the service, then:
          /etc/init.d/sing-box enable
          /etc/init.d/sing-box restart

          OpenConnect idle timeout (0xb0) triggers reauthentication/reconnection.
          MFA may still require user interaction.
          EOF
          cd dist
          sha256sum sing-box_openwrt_aarch64_cortex-a53.apk > SHA256SUMS
      - name: Upload OpenWrt package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sing-box-openwrt-aarch64_cortex-a53
          path: dist/
          if-no-files-found: error
