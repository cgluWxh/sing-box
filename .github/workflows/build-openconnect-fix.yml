      #     fi
      # - name: Build Windows amd64 Desktop daemon
      #   run: |
      #     go run ./cmd/internal/build_boxdd -target windows/amd64 -output dist-daemon/sing-box-daemon.exe
      #     cp LICENSE dist-daemon/
      # - name: Stage daemon Naive runtime
      #   run: |
      #     set -euo pipefail
      #     VERSION=$(cat .github/CRONET_GO_VERSION)
      #     RUNTIME_DIR="$RUNNER_TEMP/cronet-go-daemon-runtime"
      #     git init "$RUNTIME_DIR"
      #     git -C "$RUNTIME_DIR" remote add origin https://github.com/sagernet/cronet-go.git
